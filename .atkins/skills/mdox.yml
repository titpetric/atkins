name: Markdown formatting and linting
help: >-
  Formats and checks the markdown under docs/ and README.md with mdox, and
  lints the prose of the markdown and the Go doc comments with vale.
  mdox:fmt rewrites the files in place; mdox:lint only reports.

when:
  files:
    - docs/
    - README.md

tasks:
  default:
    desc: "Run mdox to check markdowns"
    cmds:
      - task: lint

  fmt:
    desc: "Run mdox to format markdowns"
    passthru: true
    cmds:
      - if: $(test -d docs)
        cmd: mdox fmt --soft-wraps ${{ files }} || true
        vars:
          files: $(find ./docs -name '*.md' 2>/dev/null | xargs --no-run-if-empty echo || true)
      - if: $(test -f README.md)
        cmd: mdox fmt --soft-wraps README.md

  lint:
    desc: "Run vale to lint language"
    passthru: true
    vars:
      files: $(find ./docs -name '*.md' 2>/dev/null | xargs --no-run-if-empty echo || true)
    cmds:
      - if: $(test -d docs)
        cmd: mdox fmt --check --soft-wraps ${{ files }}
      # The image carries the style and its configuration, so the repository
      # holds no vale config and every finding fails the job.
      - docker run --rm -v $PWD:/src registry.cdn.si/vale --output=line .

  setup:
    desc: "Install bwplotka/mdox"
    interactive: true
    cmds:
      - go install github.com/bwplotka/mdox@latest
