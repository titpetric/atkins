{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
  {{template "head"}}
  <title>Sign in — atkins</title>
</head>
<body>
  <header>
    <h1>Sign in</h1>
    <p class="muted">The same account <span class="mono">atkins --login</span> uses.</p>
  </header>

  {{if .Error}}<p class="flash flash-error">{{.Error}}</p>{{end}}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <p><button type="submit" class="primary">Sign in</button></p>
  </form>

  <p class="muted">
    No account yet? Run <span class="mono">atkins --register &lt;server&gt;</span>.
    The first account on a fresh instance becomes an administrator.
  </p>

  <p><a href="/">All jobs</a></p>
</body>
</html>
{{end}}
