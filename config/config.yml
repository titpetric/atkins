# atkins configuration.
#
# This document ships inside the binary as the runtime default. atkins
# reads a project copy at .atkins/config.yml on top of it, and then the
# ATKINS_* environment variables, field by field.
#
# Edit it with `atkins --config`.

version: 1

# What a run records, and where.
storage:
  # The workspace's file, $HOME/.atkins/atkins.db when unset, or a list
  # of files in the form of PATH: the first is the workspace's, the rest
  # are mirrors that take the same rows and are never read. The project's,
  # the atkins.db of the nearest .atkins folder, records as well.
  database: ""

  # Write a row per job and per command of every run, so `atkins
  # --stats` has something to report. With this off a run records
  # nothing, the same as `--local`.
  #
  # How long a run is kept is not a setting: it is 31 days on every
  # machine, and the run that records is the run that prunes.
  record: true
