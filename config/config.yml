# atkins configuration.
#
# This document ships inside the binary as the runtime default. A
# project copy at .atkins/config.yml overrides it, and ATKINS_*
# environment variables overlay individual fields on top of that.
#
# Edit it with `atkins --config`.

version: 1

# What a run records, and where.
storage:
  # The file to record into. Empty discovers it: the atkins.db of the
  # nearest .atkins folder, and $HOME/.atkins/atkins.db for a directory
  # that belongs to no project.
  database: ""

  # Write a row per job and per command of every run, so `atkins
  # --stats` has something to report. With this off a run records
  # nothing, the same as `--local`.
  #
  # How long a run is kept is not a setting: it is 31 days on every
  # machine, and the run that records is the run that prunes.
  record: true
